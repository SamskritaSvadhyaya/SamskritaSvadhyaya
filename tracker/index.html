":"narayaneeyam/dashaka-86","no":"86","name":"Destruction of Salva. Krishna saves Draupadi’s honor during the game of dice and from the wrath of Sage Durvasa. Battle of Kurukshetra","shlokas":11},{"id":"narayaneeyam/dashaka-87","no":"87","name":"Krishna bestows grace on Kuchela","shlokas":10},{"id":"narayaneeyam/dashaka-88","no":"88","name":"Krishna brings the dead children of Vasudeva and Devaki and of the brahmana back to life. Krishna shows Vaikuntha to Arjuna","shlokas":12},{"id":"narayaneeyam/dashaka-89","no":"89","name":"The story of Vrikasura and the test of Brigu","shlokas":10},{"id":"narayaneeyam/dashaka-90","no":"90","name":"Establishing the glory of Vishnu","shlokas":11},{"id":"narayaneeyam/dashaka-91","no":"91","name":"The glory of Bhakti","shlokas":10},{"id":"narayaneeyam/dashaka-92","no":"92","name":"Bhakti in Kaliyuga","shlokas":10},{"id":"narayaneeyam/dashaka-93","no":"93","name":"The learnings from the twenty-four teachers in life","shlokas":10},{"id":"narayaneeyam/dashaka-94","no":"94","name":"Enlightenment through Bhakti","shlokas":10},{"id":"narayaneeyam/dashaka-95","no":"95","name":"Supremacy of the path of Bhakti","shlokas":10},{"id":"narayaneeyam/dashaka-96","no":"96","name":"Bhakti as a self-sufficient path","shlokas":10},{"id":"narayaneeyam/dashaka-97","no":"97","name":"The story of Markandeya","shlokas":10},{"id":"narayaneeyam/dashaka-98","no":"98","name":"Praise of the Absolute Brahman","shlokas":11},{"id":"narayaneeyam/dashaka-99","no":"99","name":"Praise to the Lord in the form of the Vedas","shlokas":10},{"id":"narayaneeyam/dashaka-100","no":"100","name":"Description of Krishna","shlokas":11}]},{"key":"bhagavatam","title":"Shrimad Bhagavatam","rows":[{"id":"shrimad-bhagavatam-canto-10/book-1/ch-1","no":"1","name":"Shri Krishna Avatara","shlokas":69},{"id":"shrimad-bhagavatam-canto-10/book-1/ch-2","no":"2","name":"Vishnu enters Devaki’s womb and is praised by Brahma and the devas","shlokas":42},{"id":"shrimad-bhagavatam-canto-10/book-1/c een Shalva and Yadavas","shlokas":33},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-77","no":"77","name":"The deliverance of Shalva","shlokas":37},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-78","no":"78","name":"Deliverance of Dantavaktra and Viduratha","shlokas":40},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-79","no":"79","name":"Balvala killed and an account of the pilgrimage of Balarama","shlokas":34},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-80","no":"80","name":"The story of Sudama","shlokas":45},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-81","no":"81","name":"The story of flattened rice brought as a present to Krishna by Sudama. Krishna blesses Sudama","shlokas":41},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-82","no":"82","name":"The Meeting of Krishna and Balarama with the Gopas and Gopis of Vraja","shlokas":49},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-83","no":"83","name":"Conversation between Krishna's wives and Draupadi","shlokas":43},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-84","no":"84","name":"The teachings of the sages; Vasudeva conducts a grand sacrifice","shlokas":71},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-85","no":"85","name":"Krishna’s teachings to Vasudeva and bringing back of His six elder brothers (who were killed by Kamsa) to life","shlokas":59},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-86","no":"86","name":"Arjuna carries away Subhadra. Krishna’s grace upon Shrutadeva and Bahulashva","shlokas":59},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-87","no":"87","name":"The song of the praises by the Vedas personified in the dialogue between Narada and Narayana","shlokas":50},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-88","no":"88","name":"Lord Rudra saved from Vrikasura","shlokas":40},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-89","no":"89","name":"The three Lords (Brahma, Vishnu and Shiva) put to test by Sage Bhrigu. The dead sons of brahmana brought back to life by Krishna and Arjuna","shlokas":66},{"id":"shrimad-bhagavatam-canto-10/book-2/ch-90","no":"90","name":"Krishna’s pastimes with His wives, their lamentations on separation from Krishna and an account of Krishna’s descendants","shlokas":50}]},{"key":"geeta","title":"Bhagavad Geeta","note_title":"Bhagavad Gita: The Essence, Chapter by Chapter","note":"<p class=\"tr-note-lead\">A concise summary of all 18 chapters (700 verses), built around what each chapter is really trying to teach.</p>\n\n<h3>The Setting</h3>\n<p>On the battlefield of Kurukshetra, moments before a great war between cousins, the warrior Arjuna loses his nerve. He sees teachers, elders and relatives on the opposing side and refuses to fight. His charioteer, Krishna, uses that moment of collapse to deliver a complete guide to living: what we are, how to act, how to love, and how to be free.</p>\n<p>The Gita is not really about a battle. It is about the battle inside every person between duty and desire, clarity and confusion, fear and faith.</p>\n\n<h3>The Essence in Seven Lines</h3>\n<ul>\n  <li>You are not the body or the mind. You are the eternal, unchanging Self (atman), a part of the Supreme.</li>\n  <li>Act, but release the outcome. Do your duty fully, without being driven by craving for results or fear of failure.</li>\n  <li>Desire, anger and greed are the real enemies. They live in the mind and senses, and they cloud judgement.</li>\n  <li>Equanimity is the mark of wisdom. Steadiness in pain and pleasure, praise and blame, success and failure.</li>\n  <li>The mind can be trained. Through practice (abhyasa) and detachment (vairagya), it becomes a friend rather than an enemy.</li>\n  <li>Devotion is the highest and most accessible path. Offer your work, your love and your very self to the Divine.</li>\n  <li>Surrender completes the journey. When effort and understanding are done, trust and give yourself over to Krishna.</li>\n</ul>\n<p>Tradition often divides the eighteen chapters into three groups of six: the first six emphasise action and self-mastery (karma), the middle six devotion and the nature of God (bhakti), and the last six knowledge and the deeper truths behind it all (jnana).</p>\n\n<h3>Part One (Chapters 1 to 6): Who Am I, and How Should I Act?</h3>\n<p><strong>Chapter 1: Arjuna's Despair (Arjuna Vishada Yoga)</strong> Arjuna surveys both armies, sees his own family on the other side, and collapses emotionally. His limbs tremble, his bow slips, and he declares he would rather not fight at all.</p>\n<p class=\"tr-essence\"><em>Essence:</em> every spiritual journey begins with honest confusion. The Gita starts with a sincere student who admits he does not know what to do.</p>\n<p><strong>Chapter 2: The Eternal Self and the Steady Mind (Sankhya Yoga)</strong> Krishna begins the teaching. The Self is eternal; it is never born and never dies, so grief over the body is misplaced. He then introduces the heart of the Gita: you have a right to action, not to its fruits. Chapter 2 closes with the portrait of the sthitaprajna, the person of steady wisdom, who is unshaken by joy or sorrow and rests content in the Self.</p>\n<p class=\"tr-essence\"><em>Essence:</em> know who you are, then act without clinging to results.</p>\n<p><strong>Chapter 3: The Yoga of Action (Karma Yoga)</strong> Arjuna asks why Krishna urges action if knowledge is superior. Krishna explains that no one can truly stop acting, so the question is how to act. Work done as an offering, without selfish attachment, purifies the heart. Desire and anger, born of passion, are the great enemy.</p>\n<p class=\"tr-essence\"><em>Essence:</em> do your duty selflessly; action done as service binds no one.</p>\n<p><strong>Chapter 4: Knowledge and the Sacrifice of Action (Jnana Karma Sannyasa Yoga)</strong> Krishna reveals that he has taught this yoga since ancient times and that he descends whenever righteousness declines. He speaks of the many forms of sacrifice and declares that the sacrifice of knowledge is greater than material offerings. Knowledge burns away the reactions of karma.</p>\n<p class=\"tr-essence\"><em>Essence:</em> wisdom and action are not opposites; understanding transforms ordinary work into liberation.</p>\n<p><strong>Chapter 5: Renunciation of Action (Karma Sannyasa Yoga)</strong> Arjuna asks which is better, renouncing action or performing it selflessly. Krishna says both lead to the goal, but selfless action is easier and safer. The wise see all beings with equal vision and act like a lotus leaf, untouched by the water on it.</p>\n<p class=\"tr-essence\"><em>Essence:</em> real renunciation is inner. It means giving up attachment, not giving up responsibilities.</p>\n<p><strong>Chapter 6: The Yoga of Meditation (Dhyana Yoga)</strong> Krishna describes the practice of meditation: a steady seat, a disciplined life, a focused mind. The mind is the friend of one who masters it and the enemy of one who does not. Arjuna admits the mind is restless like the wind; Krishna agrees but says practice and detachment can tame it. He ends by naming the highest yogi: the one who worships him with faith, with the inner self absorbed in him.</p>\n<p class=\"tr-essence\"><em>Essence:</em> self-mastery through steady practice, and the best practice is love for the Divine.</p>\n\n<h3>Part Two (Chapters 7 to 12): Who Is God, and How Do I Reach Him?</h3>\n<p><strong>Chapter 7: Knowledge and Realisation (Jnana Vijnana Yoga)</strong> Krishna explains his two natures: the lower, made of matter, and the higher, the living spirit that sustains the universe. Everything is strung on him like pearls on a thread. Four kinds of people turn to him: the distressed, the seekers of wealth, the curious, and the wise. The wise, who love him without a motive, are dearest. His divine illusion (maya) is hard to cross, but those who surrender to him cross it.</p>\n<p class=\"tr-essence\"><em>Essence:</em> God is the foundation of everything, and surrender is the way past illusion.</p>\n<p><strong>Chapter 8: The Imperishable Absolute (Akshara Brahma Yoga)</strong> Arjuna asks about Brahman, the self and karma. Krishna teaches that whatever one remembers at the time of death determines the next destination, so one should remember him constantly, in all circumstances. He describes the cycles of creation and the paths of departure after death.</p>\n<p class=\"tr-essence\"><em>Essence:</em> a life lived in remembrance of God prepares the final moment.</p>\n<p><strong>Chapter 9: The Royal Knowledge, the Royal Secret (Raja Vidya Raja Guhya Yoga)</strong> Krishna calls this the most confidential teaching. He pervades the cosmos yet is not limited by it. He declares he will accept even a leaf, a flower, a fruit or water offered with love. Even those of questionable past become righteous when they worship him with exclusive devotion.</p>\n<p class=\"tr-essence\"><em>Essence:</em> devotion is simple, universal and open to everyone. What matters is love, not status or ritual.</p>\n<p><strong>Chapter 10: Divine Glories (Vibhuti Yoga)</strong> Krishna lists his manifestations: the best among sages, the Himalayas among mountains, the Ganga among rivers, the Self seated in all hearts. Whatever is splendid, powerful or beautiful is a spark of his glory. Then he says that all of it can be understood through a single fragment of his energy.</p>\n<p class=\"tr-essence\"><em>Essence:</em> see the divine in the extraordinary and in the ordinary alike.</p>\n<p><strong>Chapter 11: The Universal Form (Vishvarupa Darshana Yoga)</strong> Arjuna asks to see Krishna's cosmic form. Krishna grants divine sight, and Arjuna beholds infinite faces, eyes and weapons, with all beings entering the form like rivers into the sea, and time itself devouring the worlds. Overwhelmed, Arjuna begs for the gentle human form again. Krishna says that only by exclusive devotion can he be truly known.</p>\n<p class=\"tr-essence\"><em>Essence:</em> God is vast beyond comprehension, yet loving enough to remain approachable.</p>\n<p><strong>Chapter 12: The Yoga of Devotion (Bhakti Yoga)</strong> Arjuna asks whether it is better to worship the personal God or the formless Absolute. Krishna says both reach him, but the formless path is harder for embodied beings. He offers graded advice: fix the mind on him; if that is hard, practise; if that is hard, work for him; if that is hard, give up the fruits of action. He then describes the devotee dear to him: friendly, compassionate, free from ego, equal in pain and pleasure, forgiving, content, and fixed on him.</p>\n<p class=\"tr-essence\"><em>Essence:</em> bhakti is a way of living, defined by character as much as by feeling.</p>\n\n<h3>Part Three (Chapters 13 to 18): Understanding Nature, the Self and the Supreme</h3>\n<p><strong>Chapter 13: The Field and the Knower (Kshetra Kshetrajna Vibhaga Yoga)</strong> The body is the \"field\"; the Self is the \"knower of the field\"; and the Supreme is the knower in all fields. Krishna lists the qualities that constitute true knowledge: humility, non-violence, tolerance, simplicity, self-control, detachment, and unwavering devotion.</p>\n<p class=\"tr-essence\"><em>Essence:</em> knowledge is not information but character.</p>\n<p><strong>Chapter 14: The Three Gunas (Gunatraya Vibhaga Yoga)</strong> All of nature runs on three qualities: sattva (clarity and harmony), rajas (passion and restlessness), and tamas (inertia and delusion). They bind the soul through happiness, attachment, and ignorance respectively. One who sees that only the gunas act, and stays steady through all of them, goes beyond and reaches liberation.</p>\n<p class=\"tr-essence\"><em>Essence:</em> understand the forces shaping your moods and choices, then rise above all of them.</p>\n<p><strong>Chapter 15: The Supreme Person (Purushottama Yoga)</strong> Krishna describes the world as an upside-down banyan tree, rooted above and spreading below. It must be cut down with the axe of detachment. He then declares himself the Supreme Person (Purushottama), beyond both the perishable and the imperishable, the source of light in the sun, the fire in the stomach, and memory in every heart.</p>\n<p class=\"tr-essence\"><em>Essence:</em> find the one root of everything and let go of the endless branches.</p>\n<p><strong>Chapter 16: Divine and Demonic Natures (Daivasura Sampad Vibhaga Yoga)</strong> Krishna contrasts two types of character. The divine nature includes fearlessness, purity, charity, self-control, truthfulness, non-violence, compassion and humility. The demonic includes arrogance, hypocrisy, anger, cruelty and insatiable desire. Lust, anger and greed are called the three gates to self-destruction.</p>\n<p class=\"tr-essence\"><em>Essence:</em> scripture and conscience together are the guide; choose your nature consciously.</p>\n<p><strong>Chapter 17: The Three Kinds of Faith (Shraddhatraya Vibhaga Yoga)</strong> Faith, food, worship, austerity and charity all take three forms, according to the gunas. Austerity is refined into three disciplines: of body (cleanliness, non-violence), of speech (truthful, pleasant, beneficial words), and of mind (serenity, gentleness, self-control). The chapter closes with the sacred syllables Om Tat Sat, which sanctify every offering.</p>\n<p class=\"tr-essence\"><em>Essence:</em> the quality of what you believe and do shapes who you become.</p>\n<p><strong>Chapter 18: Liberation Through Renunciation (Moksha Sannyasa Yoga)</strong> The longest chapter is a grand summary. Krishna explains true renunciation (giving up attachment to results, not giving up action), the five factors behind every action, the three kinds of knowledge, action, doer, intellect, determination and happiness, and how each person finds perfection through their own natural work performed as worship. In the final teaching, he says: abandon all other paths, take refuge in me alone, and do not grieve. Arjuna's doubts dissolve and he declares, \"I will act according to your word.\"</p>\n<p class=\"tr-essence\"><em>Essence:</em> do your work, offer it to the Divine, and surrender with trust.</p>\n\n<h3>How to Carry It With You</h3>\n<p>If the Gita had to be reduced to a daily practice, it might look like this:</p>\n<ol>\n  <li>Begin the day by remembering who you are, beyond roles, moods and outcomes.</li>\n  <li>Do your assigned work with full effort and let go of the result.</li>\n  <li>Watch for desire and anger as they arise. They are the enemy, not the person in front of you.</li>\n  <li>Stay even-minded in the small wins and losses of the day.</li>\n  <li>Offer your actions to the Divine as a form of worship.</li>\n  <li>End the day with gratitude and surrender, trusting that you have done what you could.</li>\n</ol>","rows":[{"id":"geeta/ch-1","no":"1","name":"Arjuna Vishad Yoga","shlokas":47,"nolink":false,"href":"bhagavad-geeta/ch-1"},{"id":"geeta/ch-2","no":"2","name":"Sankhya Yoga","shlokas":72,"nolink":true},{"id":"geeta/ch-3","no":"3","name":"Karma Yoga","shlokas":43,"nolink":true},{"id":"geeta/ch-4","no":"4","name":"Gnyana Karma Sanyasa Yoga","shlokas":42,"nolink":true},{"id":"geeta/ch-5","no":"5","name":"Karma Sanyas Yoga","shlokas":29,"nolink":true},{"id":"geeta/ch-6","no":"6","name":"Atma Sanyama Yoga","shlokas":47,"nolink":true},{"id":"geeta/ch-7","no":"7","name":"Gnyana Vignyana Yoga","shlokas":30,"nolink":true},{"id":"geeta/ch-8","no":"8","name":"Akshara Brahma Yoga","shlokas":28,"nolink":true},{"id":"geeta/ch-9","no":"9","name":"Raj Vidya Raj Guhya Yoga","shlokas":34,"nolink":true},{"id":"geeta/ch-10","no":"10","name":"Vibhuti Yoga","shlokas":42,"nolink":true},{"id":"geeta/ch-11","no":"11","name":"Vishwarupa Darshana Yoga","shlokas":55,"nolink":true},{"id":"geeta/ch-12","no":"12","name":"Bhakti Yoga","shlokas":20,"nolink":false,"href":"bhagavad-geeta/ch-12"},{"id":"geeta/ch-13","no":"13","name":"Kshetra Kshetragnya Vibhaga Yoga","shlokas":34,"nolink":true},{"id":"geeta/ch-14","no":"14","name":"Guna Traya Vibhaga Yoga","shlokas":27,"nolink":true},{"id":"geeta/ch-15","no":"15","name":"Purushottama Yoga","shlokas":20,"nolink":true},{"id":"geeta/ch-16","no":"16","name":"Daivasura Sampad Vibhaga Yoga","shlokas":24,"nolink":true},{"id":"geeta/ch-17","no":"17","name":"Shraddha Traya Vibhaga Yoga","shlokas":28,"nolink":true},{"id":"geeta/ch-18","no":"18","name":"Moksha Sanyasa Yoga","shlokas":78,"nolink":true}]}]</script>
